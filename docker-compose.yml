services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Clé de chiffrement au repos partagée (voir backend/src/lib/crypto.ts)
      # : session du portail électeurs, clés API Brevo/Mistral. Le nom date
      # du scraping CCMMEP/académique (retiré), gardé pour ne pas invalider
      # les secrets déjà chiffrés avec sur les déploiements existants.
      SCRAPING_SECRET_KEY: ${SCRAPING_SECRET_KEY}
      SYSTEM_EMAIL_BREVO_API_KEY: ${SYSTEM_EMAIL_BREVO_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # "full" (par défaut) ou "relance-only" — voir GET /api/config. Ne pas
      # définir APP_MODE dans .env laisse ce déploiement en mode complet.
      APP_MODE: ${APP_MODE:-full}
      # Requis uniquement en mode "relance-only" (voir .env.example).
      RELANCE_DEMO_EMAIL: ${RELANCE_DEMO_EMAIL}
    volumes:
      - backend_data:/app/data
    expose:
      - "4000"

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Port hôte exposé, 80 par défaut (prod). Sur un déploiement secondaire
      # partageant le même serveur qu'une prod déjà sur le port 80 (ex. la
      # sandbox "relance-only"), définir FRONTEND_PORT dans .env (ex. 8080).
      - "${FRONTEND_PORT:-80}:80"

volumes:
  backend_data:
