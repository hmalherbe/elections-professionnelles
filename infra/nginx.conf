server {
    listen 80;
    server_name _;

    # >= la limite multer de l'import zip (4 Go, voir routes/documentFolders.ts) : sinon nginx
    # rejette la requête (413 "Request Entity Too Large") avant même qu'elle atteigne le backend.
    # Un zip de plusieurs Go (beaucoup de documents scannés) peut prendre du temps à téléverser
    # depuis une connexion de bureau/domicile — client_body_timeout couvre cette phase d'envoi,
    # proxy_read_timeout/proxy_send_timeout le temps de traitement côté backend une fois reçu.
    client_max_body_size 4096m;
    client_body_timeout 600s;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # index.html référence les fichiers JS/CSS par leur nom haché par Vite
    # (ex. index-D1-uRFGZ.js) : ces fichiers hachés peuvent être mis en cache
    # indéfiniment (un contenu modifié change de nom), mais index.html lui-même
    # ne doit JAMAIS être mis en cache — sans quoi le navigateur peut continuer
    # à servir, après un redéploiement, une page pointant vers l'ancien bundle
    # (anciens correctifs qui semblent "revenir"), sans refaire de requête
    # réseau tant que son cache heuristique le juge encore "frais".
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
