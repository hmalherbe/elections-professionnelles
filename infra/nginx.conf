server {
    listen 80;
    server_name _;

    # Aucune compression n'était activée par défaut : une réponse JSON de
    # plusieurs milliers de lignes (ex. "Détail par établissement", onglet
    # Scrutins) part alors intégralement non compressée sur le réseau,
    # pouvant à elle seule expliquer plusieurs secondes de latence perçue
    # selon la connexion de l'administrateur — le JSON (clés répétées à
    # chaque ligne) compresse typiquement à 10-20% de sa taille d'origine.
    # gzip_proxied any : nginx désactive sinon la compression par défaut
    # pour tout ce qui passe par proxy_pass (location /api/ ci-dessous).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/javascript text/plain application/xml image/svg+xml;

    # >= la limite multer de l'import zip (4 Go, voir routes/documentFolders.ts) : sinon nginx
    # rejette la requête (413 "Request Entity Too Large") avant même qu'elle atteigne le backend.
    # Un zip de plusieurs Go (beaucoup de documents scannés) peut prendre du temps à téléverser
    # depuis une connexion de bureau/domicile — client_body_timeout couvre cette phase d'envoi,
    # proxy_read_timeout/proxy_send_timeout le temps de traitement côté backend une fois reçu.
    client_max_body_size 4096m;
    client_body_timeout 600s;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Lien de désinscription (voir lib/unsubscribeToken.ts) : chemin très
    # court exprès, sur un domaine dédié lui-même court (spelc.cc), chaque
    # caractère comptant dans un SMS. Réécrit vers la route réelle /api/u
    # (inchangée) — ne sert qu'à ce domaine court, /api/u reste par ailleurs
    # accessible sur tous les domaines pour les liens déjà envoyés.
    location /u/ {
        proxy_pass http://backend:4000/api/u/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html référence les fichiers JS/CSS par leur nom haché par Vite
    # (ex. index-D1-uRFGZ.js) : ces fichiers hachés peuvent être mis en cache
    # indéfiniment (un contenu modifié change de nom), mais index.html lui-même
    # ne doit JAMAIS être mis en cache — sans quoi le navigateur peut continuer
    # à servir, après un redéploiement, une page pointant vers l'ancien bundle
    # (anciens correctifs qui semblent "revenir"), sans refaire de requête
    # réseau tant que son cache heuristique le juge encore "frais".
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
