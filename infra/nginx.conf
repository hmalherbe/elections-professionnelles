server {
    listen 80;
    server_name _;

    # >= la limite multer de l'import zip (4 Go, voir routes/documentFolders.ts) : sinon nginx
    # rejette la requête (413 "Request Entity Too Large") avant même qu'elle atteigne le backend.
    # Un zip de plusieurs Go (beaucoup de documents scannés) peut prendre du temps à téléverser
    # depuis une connexion de bureau/domicile — client_body_timeout couvre cette phase d'envoi,
    # proxy_read_timeout/proxy_send_timeout le temps de traitement côté backend une fois reçu.
    client_max_body_size 4096m;
    client_body_timeout 600s;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
